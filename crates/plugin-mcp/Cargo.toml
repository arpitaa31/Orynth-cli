[package]
name = "orynth-plugin-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orynth-kernel = { path = "../kernel" }
orynth-plugin-api = { path = "../plugin-api" }
orynth-plugin-process = { path = "../plugin-process" }
orynth-security = { path = "../security" }
orynth-tool-runtime = { path = "../tool-runtime" }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
