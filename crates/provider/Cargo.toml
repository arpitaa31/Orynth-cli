[package]
name = "orynth-provider"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orynth-kernel = { path = "../kernel" }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
